<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Matching Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Memory Matching Game</h1>

        <p>Select a difficulty and number of pairs.</p>

        <label for="difficulty">
            Difficulty
        </label>

        <select id="difficulty">
            <option value="3">Easy (3 Seconds)</option>
            <option value="5">Medium (5 Seconds)</option>
            <option value="8">Hard (8 Seconds)</option>
        </select>

        <br><br>

        <label for="pairs">
            Number of Pairs
        </label>

        <select id="pairs">
            <option value="8">8 Pairs</option>
            <option value="10">10 Pairs</option>
            <option value="12">12 Pairs</option>
        </select>

        <br>

        <button id="startBtn">
            Start Game
        </button>

        <h2 id="timer">
            Time: 0
        </h2>

        <h2 id="score">
            Score: 0
        </h2>

        <!-- Cards are added with JavaScript -->

        <div id="gameBoard"></div>

        <h2>Leaderboard</h2>

        <table>

            <tr>
                <th>Player</th>
                <th>Score</th>
            </tr>

            <tbody id="leaderboard"></tbody>

        </table>

        <br>

        <a href="index.html">
            Back to Part A
        </a>

    </div>

    <script src="memory.js"></script>

</body>

</html>
